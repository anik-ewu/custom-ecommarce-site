<header class="header">
  <div class="header__inner container">
    <a class="header__logo" routerLink="/" aria-label="Kinbo home">Kinbo</a>

    <nav class="header__nav" aria-label="Main">
      <a
        class="stitch-link"
        routerLink="/shop"
        routerLinkActive
        #shop="routerLinkActive"
        [attr.aria-current]="shop.isActive ? 'page' : null"
        >Shop</a
      >
    </nav>

    <div class="header__actions">
      @if (auth.user(); as user) {
        <a
          class="header__action stitch-link"
          routerLink="/account"
          routerLinkActive
          #account="routerLinkActive"
          [attr.aria-current]="account.isActive ? 'page' : null"
          [attr.aria-label]="'Your account, ' + user.name"
          >Account</a
        >
      } @else {
        <a class="header__action stitch-link" routerLink="/login">Sign in</a>
      }
      <a
        class="header__action header__cart stitch-link"
        routerLink="/cart"
        [attr.aria-label]="'Cart, ' + cart.count() + (cart.count() === 1 ? ' item' : ' items')"
        >Cart
        @if (cart.count() > 0) {
          <span class="header__count" aria-hidden="true">{{ cart.count() }}</span>
        }
      </a>
    </div>

    <form class="header__search" role="search" [formGroup]="searchForm" (ngSubmit)="search()">
      <label class="visually-hidden" for="site-search">Search the collection</label>
      <input
        id="site-search"
        type="search"
        formControlName="q"
        placeholder="Search kantha, jute…"
      />
    </form>
  </div>
</header>
