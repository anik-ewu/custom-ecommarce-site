<header class="header">
  <div class="header__inner container">
    <a class="header__logo" routerLink="/" aria-label="Nokshi Kathar Math home">
      <svg class="header__mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" />
        <path d="M16 23c-4-3-5-7-3.5-11C14 15 15 17 16 19c1-2 2-4 3.5-7C21 16 20 20 16 23Z" />
      </svg>
      <span>Nokshi Kathar Math</span>
    </a>

    <nav class="header__nav" aria-label="Main">
      <a
        class="stitch-link"
        routerLink="/shop"
        routerLinkActive
        #shop="routerLinkActive"
        [attr.aria-current]="shop.isActive ? 'page' : null"
        >Shop</a
      >
      <a class="stitch-link" routerLink="/shop" [queryParams]="{ type: 'unique' }">One of a kind</a>
    </nav>

    <div class="header__actions">
      @if (auth.isAdmin()) {
        <a class="header__action stitch-link" routerLink="/admin">Admin</a>
      }
      @if (auth.user(); as user) {
        <a
          class="header__action stitch-link"
          routerLink="/account"
          routerLinkActive
          #account="routerLinkActive"
          [attr.aria-current]="account.isActive ? 'page' : null"
          [attr.aria-label]="'Your account, ' + user.name"
          >Account</a
        >
      } @else {
        <a class="header__action stitch-link" routerLink="/login">Sign in</a>
      }
      <a
        class="header__action header__cart stitch-link"
        routerLink="/cart"
        [attr.aria-label]="'Cart, ' + cart.count() + (cart.count() === 1 ? ' item' : ' items')"
        >Cart
        @if (cart.count() > 0) {
          <span class="header__count" aria-hidden="true">{{ cart.count() }}</span>
        }
      </a>
    </div>

    <form class="header__search" role="search" [formGroup]="searchForm" (ngSubmit)="search()">
      <label class="visually-hidden" for="site-search">Search the collection</label>
      <input
        id="site-search"
        type="search"
        formControlName="q"
        placeholder="Search kantha, jute…"
      />
    </form>
  </div>
</header>
